name: Deploy Edge Function

# Деплой Edge Function process-document в Supabase.
# Выполняется на GitHub-раннере (полная сеть), не в песочнице.
# Нужен один секрет репозитория: SUPABASE_ACCESS_TOKEN (personal access token sbp_...).
# Project ref берётся из переменной SUPABASE_PROJECT_REF (или дефолт ниже).

on:
  push:
    branches:
      - claude/healthvault-foundation-6u53re
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-function.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy process-document
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'xvcappfrwhofuqnzyoro' }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Секрет SUPABASE_ACCESS_TOKEN не задан. Добавьте его в Settings → Secrets and variables → Actions → Secrets."
            exit 1
          fi
          supabase functions deploy process-document --project-ref "$PROJECT_REF"
